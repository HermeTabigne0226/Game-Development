name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Prepare Android SDK licenses
        run: |
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
            "$SDK_MGR" "platforms;android-36" "build-tools;35.0.0" || true
          fi

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chronicles-of-the-Shattered-Crown-apk
          path: android/app/build/outputs/apk/debug/Chronicles-of-the-Shattered-Crown.apk

      - name: Read app version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish Latest Android APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Chronicles of the Shattered Crown (Android APK)
          body: |
            Version: v.${{ steps.pkg.outputs.version }}
            Latest Android APK build from main branch.
          files: android/app/build/outputs/apk/debug/Chronicles-of-the-Shattered-Crown.apk
          prerelease: false
          draft: false
          make_latest: true
